[package]
name = "javacraft"
version = "0.1.4"
edition = "2021"
description = "Entrenador de Java para escritorio"

[dependencies]
eframe = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png"] }
webbrowser = "1"
ureq = { version = "2", features = ["json"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = true
codegen-units = 1
